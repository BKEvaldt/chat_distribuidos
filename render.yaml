databases:
  - name: chat-distribuido-db
    plan: free
    databaseName: chat_distribuido
    user: chat_distribuido

envVarGroups:
  - name: chat-distribuido-shared
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: REPLICATION_TOKEN
        generateValue: true
      - key: ENABLE_FAILOVER_CONTROL
        value: "1"
      - key: HEARTBEAT_INTERVAL
        value: "2"
      - key: FAILURE_THRESHOLD
        value: "3"
      - key: MAX_HISTORY
        value: "100"
      - key: SOCKET_AUTH_MAX_AGE
        value: "43200"
      - key: PRIMARY_RESTORE_TIMEOUT
        value: "30"

services:
  - type: web
    name: chat-distribuido-primary
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app db upgrade && gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /health
    envVars:
      - fromGroup: chat-distribuido-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chat-distribuido-db
          property: connectionString
      - key: PRIMARY_PUBLIC_URL
        value: https://chat-distribuido-primary.onrender.com
      - key: BACKUP_PUBLIC_URL
        value: https://chat-distribuido-backup.onrender.com
      - key: BACKUP_INTERNAL_URL
        value: https://chat-distribuido-backup.onrender.com

  - type: web
    name: chat-distribuido-backup
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py backup_wsgi:app
    healthCheckPath: /health
    envVars:
      - fromGroup: chat-distribuido-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chat-distribuido-db
          property: connectionString
      - key: PRIMARY_PUBLIC_URL
        value: https://chat-distribuido-primary.onrender.com
      - key: BACKUP_PUBLIC_URL
        value: https://chat-distribuido-backup.onrender.com
      - key: PRIMARY_INTERNAL_URL
        value: https://chat-distribuido-primary.onrender.com
